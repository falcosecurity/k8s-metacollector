name: Helm Chart Check

on:
  push:
    branches:
      - main
    paths:
      - "chart/k8s-metacollector/**"
      - ".github/workflows/helm-check.yaml"
      - "ct.yaml"
      - "Makefile"
  pull_request:
    paths:
      - "chart/k8s-metacollector/**"
      - ".github/workflows/helm-check.yaml"
      - "ct.yaml"
      - "Makefile"

jobs:
  helm-check:
    name: Verify Helm Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: "4.1.1"

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: "go.mod"
          check-latest: true

      - name: Install helm-docs
        run: go install github.com/norwoodj/helm-docs/cmd/helm-docs@v1.11.0

      - name: Verify chart README and unit tests
        run: HELM_DOCS="$(go env GOPATH)/bin/helm-docs" make chart-docs-check chart-unit-test

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Set up chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0

      - name: Run chart-testing lint
        run: ct lint --config ct.yaml --charts chart/k8s-metacollector

      - name: Create KIND Cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0

      - name: Run chart-testing install
        run: ct install --exclude-deprecated --config ct.yaml --charts chart/k8s-metacollector
