name: Helm Chart Check

on:
  push:
    branches:
      - main
    paths:
      - "chart/k8s-metacollector/**"
      - ".github/workflows/helm-check.yaml"
      - "ct.yaml"
      - "Makefile"
  pull_request:
    paths:
      - "chart/k8s-metacollector/**"
      - ".github/workflows/helm-check.yaml"
      - "ct.yaml"
      - "Makefile"

jobs:
  helm-check:
    name: Verify Helm Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: "4.1.1"

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          check-latest: true

      - name: Install helm-docs
        run: go install github.com/norwoodj/helm-docs/cmd/helm-docs@v1.11.0

      - name: Verify chart README and unit tests
        run: HELM_DOCS="$(go env GOPATH)/bin/helm-docs" make chart-docs-check chart-unit-test

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"

      - name: Set up chart-testing
        uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0

      - name: Run chart-testing lint
        run: ct lint --config ct.yaml --charts chart/k8s-metacollector

      - name: Create KIND Cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1

      - name: Run chart-testing install
        run: ct install --exclude-deprecated --config ct.yaml --charts chart/k8s-metacollector
