version: "2"

run:
  timeout: 10m

linters:
  enable:
    - asciicheck
    - asasalint
    - bidichk
    - bodyclose
    - containedctx
    - copyloopvar
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - goconst
    - gocritic
    - gocyclo
    - godot
    - goheader
    - gomodguard
    - goprintffuncname
    - gosec
    - govet
    - ineffassign
    - importas
    - intrange
    - lll
    - misspell
    - modernize
    - nakedret
    - nilerr
    - noctx
    - nolintlint
    - predeclared
    - promlinter
    - reassign
    - revive
    - rowserrcheck
    - staticcheck
    - testifylint
    - unconvert
    - unparam
    - unused
    - usetesting
    - wastedassign
    - whitespace
  settings:
    exhaustive:
      default-signifies-exhaustive: true
    goheader:
      values:
        const:
          AUTHORS: The Falco Authors
      template: |-
        SPDX-License-Identifier: Apache-2.0
        Copyright {{ YEAR }} {{ AUTHORS }}

        Licensed under the Apache License, Version 2.0 (the "License");
        you may not use this file except in compliance with the License.
        You may obtain a copy of the License at

             http://www.apache.org/licenses/LICENSE-2.0

        Unless required by applicable law or agreed to in writing, software
        distributed under the License is distributed on an "AS IS" BASIS,
        WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.
        See the License for the specific language governing permissions and
        limitations under the License.
    lll:
      line-length: 150
    goconst:
      min-len: 2
      min-occurrences: 2
    gocritic:
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
    govet:
      disable:
        - fieldalignment
        - shadow
      enable-all: true
    importas:
      alias:
        - pkg: k8s.io/api/([a-z]+)/(v[\w\d]+)
          alias: ${1}${2}
        - pkg: k8s.io/apimachinery/pkg/apis/meta/v1
          alias: metav1
        - pkg: k8s.io/apimachinery/pkg/api/errors
          alias: k8serrors
        - pkg: sigs.k8s.io/controller-runtime/pkg/log
          alias: ctrllog
    misspell:
      locale: US
    nolintlint:
      allow-unused: false
      require-explanation: true
      require-specific: true
    dupl:
      threshold: 300
    revive:
      rules:
        - name: dot-imports
          disabled: true
        - name: errorf
          severity: warning
          disabled: false
        - name: error-strings
          severity: warning
          disabled: false
        - name: error-naming
          severity: warning
          disabled: false
        - name: empty-block
          severity: warning
          disabled: false
    testifylint:
      enable-all: true
      disable:
        - require-error
    usetesting:
      os-temp-dir: true
  exclusions:
    paths:
      - ^chart/k8s-metacollector/tests/unit/
    rules:
      # errcheck: Almost all programs ignore errors on these functions
      - linters:
          - errcheck
        text: Error return value of .((os\.)?std(out|err)\..*|.*Close|.*Flush|os\.Remove(All)?|.*printf?|os\.(Un)?Setenv). is not checked
      - linters:
          - govet
        text: 'declaration of "(err|ctx)" shadows declaration at'
      - linters:
          - errorlint
        # Disable the check for error type assertions in type switches.
        text: type switch on error will fail on wrapped errors. Use errors.As to check for specific errors
      # Disable goheader for multi-author files
      - linters:
          - goheader
        path: pkg/oci/authn/credentialstore.go
      # Relax gosec in tests
      - linters:
          - gosec
        path: .*_test\.go
        text: Use of weak random number generator
      - linters:
          - gosec
        path: .*_test\.go
        text: Potential hardcoded credentials
      # Exclude whitespace linter from test files
      - path: _test\.go
        linters:
          - whitespace
      # Disable exported-symbol godoc requirement inside internal/test packages
      - linters:
          - revive
        path: internal/|test/
        text: 'exported: exported'

formatters:
  enable:
    - gci
    - gofmt
    - goimports
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/falcosecurity/k8s-metacollector)
      custom-order: true
    goimports:
      local-prefixes:
        - github.com/falcosecurity/k8s-metacollector

issues:
  fix: true
  max-issues-per-linter: 0
  max-same-issues: 0
